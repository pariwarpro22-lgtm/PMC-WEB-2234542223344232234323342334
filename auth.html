<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pariwar Multipurpose Company - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo i {
            font-size: 60px;
            color: white;
            background: rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 50%;
            margin-bottom: 15px;
        }

        .logo h1 {
            color: white;
            font-size: 28px;
            margin-bottom: 5px;
        }

        .logo p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            background: #f5f5f5;
            padding: 5px;
            border-radius: 12px;
        }

        .tab {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            color: #666;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab.active {
            background: #667eea;
            color: white;
        }

        .form {
            display: none;
        }

        .form.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-group i:first-child {
            position: absolute;
            left: 15px;
            color: #999;
            font-size: 16px;
            z-index: 1;
        }

        .input-group input {
            width: 100%;
            padding: 14px 45px 14px 45px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s;
        }

        .input-group input:focus {
            border-color: #667eea;
            outline: none;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .input-group input::placeholder {
            color: #aaa;
            font-size: 14px;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            cursor: pointer;
            color: #999;
            z-index: 2;
        }

        .toggle-password:hover {
            color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .error {
            color: #dc3545;
            font-size: 12px;
            margin-top: 5px;
            min-height: 18px;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
            border-left: 4px solid #28a745;
            display: none;
        }

        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #ffffff;
            border-top: 3px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <i class="fas fa-building"></i>
            <h1>Pariwar Multipurpose Company</h1>
            <p>Government Tender Specialists - Nepal</p>
        </div>

        <div class="card">
            <div class="tabs">
                <button class="tab active" id="loginTab">Login</button>
                <button class="tab" id="signupTab">Sign Up</button>
            </div>

            <!-- Success/Error Message -->
            <div id="message" class="success"></div>

            <!-- Login Form -->
            <div id="loginForm" class="form active">
                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="loginEmail" placeholder="Enter your email">
                        <i class="fas fa-eye toggle-password" onclick="togglePassword('loginPassword', this)"></i>
                    </div>
                    <div id="loginEmailError" class="error"></div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="loginPassword" placeholder="Enter your password">
                    </div>
                    <div id="loginPasswordError" class="error"></div>
                </div>

                <button class="btn" id="loginBtn">
                    <span class="btn-content">
                        <i class="fas fa-sign-in-alt"></i>
                        Login
                    </span>
                </button>
            </div>

            <!-- Signup Form -->
            <div id="signupForm" class="form">
                <div class="form-group">
                    <label>Username</label>
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="text" id="signupUsername" placeholder="Choose a username">
                        <i class="fas fa-eye toggle-password" onclick="togglePassword('signupPassword', this)"></i>
                    </div>
                    <div id="signupUsernameError" class="error"></div>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="signupEmail" placeholder="Enter your email">
                    </div>
                    <div id="signupEmailError" class="error"></div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="signupPassword" placeholder="Create a password (min 6 characters)">
                    </div>
                    <div id="signupPasswordError" class="error"></div>
                </div>

                <button class="btn" id="signupBtn">
                    <span class="btn-content">
                        <i class="fas fa-user-plus"></i>
                        Create Account
                    </span>
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword, 
            updateProfile,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            setDoc 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBBF0xmwpheilz9CM5jbUn0_wZLU108B0I",
            authDomain: "pariwar-multinational-company.firebaseapp.com",
            projectId: "pariwar-multinational-company",
            storageBucket: "pariwar-multinational-company.firebasestorage.app",
            messagingSenderId: "496150499168",
            appId: "1:496150499168:web:5628cc7c820d2cf285d805"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Make auth functions available globally
        window.auth = auth;
        window.db = db;
        window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
        window.signInWithEmailAndPassword = signInWithEmailAndPassword;
        window.updateProfile = updateProfile;
        window.doc = doc;
        window.setDoc = setDoc;

        console.log("Firebase initialized");

        // Check if user is already logged in - FIXED: Only redirect if not already on dashboard
        onAuthStateChanged(auth, (user) => {
            if (user) {
                console.log("User is logged in:", user.email);
                // Don't auto-redirect from auth page - let user stay on auth page
                // This prevents the refresh loop
            }
        });
    </script>

    <script>
        // Tab switching
        document.getElementById('loginTab').addEventListener('click', function() {
            document.getElementById('loginTab').classList.add('active');
            document.getElementById('signupTab').classList.remove('active');
            document.getElementById('loginForm').classList.add('active');
            document.getElementById('signupForm').classList.remove('active');
            document.getElementById('message').style.display = 'none';
            clearAllErrors();
        });

        document.getElementById('signupTab').addEventListener('click', function() {
            document.getElementById('signupTab').classList.add('active');
            document.getElementById('loginTab').classList.remove('active');
            document.getElementById('signupForm').classList.add('active');
            document.getElementById('loginForm').classList.remove('active');
            document.getElementById('message').style.display = 'none';
            clearAllErrors();
        });

        // Toggle password visibility
        window.togglePassword = function(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        };

        // Clear all errors
        function clearAllErrors() {
            document.querySelectorAll('.error').forEach(el => el.textContent = '');
        }

        // Show message
        function showMessage(text, isSuccess = true) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.style.display = 'block';
            messageDiv.className = isSuccess ? 'success' : 'error';
            
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 3000);
        }

        // Set loading state
        function setLoading(buttonId, isLoading, originalHtml) {
            const btn = document.getElementById(buttonId);
            if (isLoading) {
                btn.disabled = true;
                btn.innerHTML = '<span class="btn-content"><span class="loader"></span>Please wait...</span>';
            } else {
                btn.disabled = false;
                btn.innerHTML = `<span class="btn-content">${originalHtml}</span>`;
            }
        }

        // Login
        document.getElementById('loginBtn').addEventListener('click', async function() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            // Clear previous errors
            document.getElementById('loginEmailError').textContent = '';
            document.getElementById('loginPasswordError').textContent = '';
            
            // Validate
            if (!email) {
                document.getElementById('loginEmailError').textContent = 'Email is required';
                return;
            }
            if (!password) {
                document.getElementById('loginPasswordError').textContent = 'Password is required';
                return;
            }
            
            // Show loading
            setLoading('loginBtn', true, '<i class="fas fa-sign-in-alt"></i> Login');
            
            try {
                // Sign in
                const userCredential = await window.signInWithEmailAndPassword(window.auth, email, password);
                console.log('Login successful:', userCredential.user.email);
                
                showMessage('Login successful! Redirecting...', true);
                
                // Redirect to dashboard
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
                
            } catch (error) {
                console.error('Login error:', error.code);
                
                let errorMessage = 'Invalid email or password';
                if (error.code === 'auth/user-not-found') {
                    errorMessage = 'No account found with this email';
                } else if (error.code === 'auth/wrong-password') {
                    errorMessage = 'Incorrect password';
                } else if (error.code === 'auth/too-many-requests') {
                    errorMessage = 'Too many failed attempts. Try again later';
                }
                
                document.getElementById('loginPasswordError').textContent = errorMessage;
                setLoading('loginBtn', false, '<i class="fas fa-sign-in-alt"></i> Login');
            }
        });

        // Signup
        document.getElementById('signupBtn').addEventListener('click', async function() {
            const username = document.getElementById('signupUsername').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            
            // Clear previous errors
            document.getElementById('signupUsernameError').textContent = '';
            document.getElementById('signupEmailError').textContent = '';
            document.getElementById('signupPasswordError').textContent = '';
            
            // Validate
            if (!username) {
                document.getElementById('signupUsernameError').textContent = 'Username is required';
                return;
            }
            if (username.length < 3) {
                document.getElementById('signupUsernameError').textContent = 'Username must be at least 3 characters';
                return;
            }
            if (!email) {
                document.getElementById('signupEmailError').textContent = 'Email is required';
                return;
            }
            if (!email.includes('@') || !email.includes('.')) {
                document.getElementById('signupEmailError').textContent = 'Enter a valid email';
                return;
            }
            if (!password) {
                document.getElementById('signupPasswordError').textContent = 'Password is required';
                return;
            }
            if (password.length < 6) {
                document.getElementById('signupPasswordError').textContent = 'Password must be at least 6 characters';
                return;
            }
            
            // Show loading
            setLoading('signupBtn', true, '<i class="fas fa-user-plus"></i> Create Account');
            
            try {
                // Create user
                const userCredential = await window.createUserWithEmailAndPassword(window.auth, email, password);
                const user = userCredential.user;
                
                console.log('User created:', user.uid);
                
                // Update profile with username
                await window.updateProfile(user, {
                    displayName: username
                });
                
                // Save to Firestore
                await window.setDoc(window.doc(window.db, 'users', user.uid), {
                    username: username,
                    email: email,
                    userId: user.uid,
                    createdAt: new Date().toISOString()
                });
                
                console.log('User data saved to Firestore');
                
                showMessage('Account created successfully! Redirecting...', true);
                
                // Redirect to dashboard
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
                
            } catch (error) {
                console.error('Signup error:', error.code);
                
                let errorMessage = error.message;
                if (error.code === 'auth/email-already-in-use') {
                    errorMessage = 'This email is already registered';
                } else if (error.code === 'auth/invalid-email') {
                    errorMessage = 'Invalid email address';
                } else if (error.code === 'auth/weak-password') {
                    errorMessage = 'Password is too weak';
                }
                
                document.getElementById('signupEmailError').textContent = errorMessage;
                setLoading('signupBtn', false, '<i class="fas fa-user-plus"></i> Create Account');
            }
        });

        // Enter key handler
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                if (document.getElementById('loginForm').classList.contains('active')) {
                    document.getElementById('loginBtn').click();
                } else {
                    document.getElementById('signupBtn').click();
                }
            }
        });
    </script>
</body>
</html>
